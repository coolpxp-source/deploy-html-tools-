<!--
=================================================
  ✏️ 너비 수정할 때 아래 3곳을 같이 바꾸세요
  1) <svg width="530"        → 원하는 값
  2) viewBox="0 0 530 78"   → 세 번째 숫자도 같이
  3) <rect width="530" ...  → 배경 박스도 같이
=================================================
-->
<svg xmlns="http://www.w3.org/2000/svg"
  width="530"
  height="78"
  viewBox="0 0 530 78">

  <defs>
    <clipPath id="tc">

      <!-- 이 width 는 0 고정 — 애니메이션 시작값이라 건드리지 마세요 -->
      <rect x="32" y="0" height="78" width="0">

        <!--
          글자 한 칸씩 나타나는 애니메이션
          ✏️ values 마지막 471 = 전체 텍스트 너비
             텍스트를 바꾸면 이 숫자들도 다시 계산 필요
          ✏️ dur = 전체 루프 시간 (클수록 느려요)
        -->
        <animate
          attributeName="width"
          calcMode="discrete"
          values="0;22;44;66;88;110;115;122;144;166;188;210;217;239;261;283;290;303;316;328;336;342;355;362;374;387;400;422;444;466;471;471;0;0"
          keyTimes="0;0.0125;0.025;0.0375;0.05;0.0625;0.075;0.0875;0.1;0.1125;0.125;0.1375;0.15;0.1625;0.175;0.1875;0.2;0.2125;0.225;0.2375;0.25;0.2625;0.275;0.2875;0.3;0.3125;0.325;0.3375;0.35;0.3625;0.375;0.6875;0.6876;1"
          dur="8s"
          repeatCount="indefinite"/>

      </rect>
    </clipPath>
  </defs>

  <!--
    ✏️ 배경 박스
    width/height → SVG 크기와 동일하게 맞추세요
    rx           → 모서리 둥글기
    fill         → 배경 색상
  -->
  <rect width="530" height="78" rx="10" fill="#0d1117"/>

  <!--
    ✏️ 왼쪽 프롬프트 기호
    fill → 기호 색상
    내용 → › 대신 > $ ~ 등으로 바꿔도 돼요
  -->
  <text x="12" y="50"
    font-family="'Courier New', Courier, monospace"
    font-size="20"
    font-weight="bold"
    fill="#3fb950">›</text>

  <!--
    ✏️ 타이핑되는 본문 텍스트
    font-size → 글자 크기
    fill      → 글자 색상
    맨 마지막 > 뒤에 본인 소개글 작성
  -->
  <text x="32" y="50"
    font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
    font-size="22"
    fill="#c9d1d9"
    clip-path="url(#tc)">어서오세요. 성장하는 개발자 (본인 이름) 입니다.</text>

  <!--
    커서 블록
    fill   → 커서 색상
    y      → 커서 세로 위치
    height → 커서 높이
  -->
  <rect y="28" width="2" height="24" rx="1" fill="#58a6ff">

    <!--
      커서 이동 (글자 따라 움직임)
      values = 텍스트 시작 x(32) + 각 글자 누적 너비
    -->
    <animate
      attributeName="x"
      calcMode="discrete"
      values="32;54;76;98;120;142;147;154;176;198;220;242;249;271;293;315;322;335;348;360;368;374;387;394;406;419;432;454;476;498;503;503;32;32"
      keyTimes="0;0.0125;0.025;0.0375;0.05;0.0625;0.075;0.0875;0.1;0.1125;0.125;0.1375;0.15;0.1625;0.175;0.1875;0.2;0.2125;0.225;0.2375;0.25;0.2625;0.275;0.2875;0.3;0.3125;0.325;0.3375;0.35;0.3625;0.375;0.6875;0.6876;1"
      dur="8s"
      repeatCount="indefinite"/>

    <!--
      ✏️ 커서 깜빡임
      dur → 깜빡임 속도 (작을수록 빠르게 깜빡여요)
    -->
    <animate
      attributeName="opacity"
      values="1;0"
      keyTimes="0;0.5"
      calcMode="discrete"
      dur="0.7s"
      repeatCount="indefinite"/>

  </rect>
</svg>
