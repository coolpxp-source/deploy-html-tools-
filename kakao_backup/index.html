<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카카오톡 대화 백업 생성기</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  background: #f0f0f0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px 16px;
  height: 100vh;
  overflow: hidden;
}

/* ── 전체 레이아웃 ── */
.wrap {
  display: grid;
  grid-template-columns: 310px 1fr;
  gap: 0;
  border: 1px solid #ddd;
  border-radius: 12px;
  overflow: hidden;
  background: #fff;
  width: 100%;
  height: 90vh;
  max-width: 860px;
}

/* ── 왼쪽 패널 ── */
.panel { border-right: 1px solid #ddd; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.panel h2 { font-size: 14px; font-weight: 600; color: #333; padding-bottom: 8px; border-bottom: 1px solid #eee; }
.panel-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.panel-footer { padding: 6px 14px; border-top: 1px solid #eee; flex-shrink: 0; background: #fff; }

/* ── 세그먼트 버튼 ── */
.seg { display: flex; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; padding: 7px 0; font-size: 13px; background: transparent; border: none; cursor: pointer; color: #888; font-family: inherit; transition: all .15s; }
.seg button.active { background: #e8f0fe; color: #1a73e8; font-weight: 600; }

/* ── 단축키 힌트 ── */
.shortcut-hint { font-size: 11px; color: #aaa; text-align: center; margin-top: 3px; }
.shortcut-hint kbd { background: #f5f5f5; border: 1px solid #ddd; border-radius: 4px; padding: 1px 5px; font-family: inherit; font-size: 11px; color: #666; }

/* ── 폼 요소 ── */
label { font-size: 12px; color: #666; display: block; margin-bottom: 3px; }
input[type=text], input[type=date], textarea, select {
  width: 100%; font-size: 13px; padding: 7px 10px;
  border: 1px solid #ddd; border-radius: 8px;
  background: #fff; color: #333; font-family: inherit; resize: none;
}
textarea { height: 72px; line-height: 1.5; }

/* ── 공통 버튼 ── */
.btn { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 13px; background: transparent; color: #333; font-family: inherit; }
.btn.primary { background: #FEE500; border-color: #e6cf00; color: #111; font-weight: 600; }
.btn.save    { background: #4CAF50; border-color: #3d8b40; color: #fff; font-weight: 600; }
.btn.ghost   { color: #888; }
.btn.danger  { color: #c33; }

/* JS 토글용 */
.hidden { display: none; }
#name-area { display: none; }
#name-area.active { display: block; }
.edit-banner { display: none; background: #fffbe6; border: 1px solid #e6cf00; border-radius: 8px; padding: 6px 10px; font-size: 12px; color: #7a5c00; }
.edit-banner.active { display: block; }
.btn-clear { display: none; border: none; background: none; color: #c00; cursor: pointer; font-size: 13px; padding: 0; }
.btn-clear.active { display: inline; }
.img-preview { display: none; margin-top: 6px; max-width: 100%; max-height: 100px; border-radius: 8px; object-fit: cover; border: 1px solid #eee; }
.img-preview.active { display: block; }
.copy-msg { display: none; font-size: 12px; color: green; text-align: center; }
.copy-msg.active { display: block; }

/* ── 날짜 구분선 입력 ── */
.date-input-area { display: none; gap: 6px; margin-top: 6px; }
.date-input-area.open { display: flex; }
.date-input-area input[type=date] { flex: 1; }
.date-input-area button { padding: 7px 12px; background: #FEE500; border: 1px solid #e6cf00; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; white-space: nowrap; }

/* ── 메시지 목록 ── */
.msglist { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 6px; }
.msgitem { display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 4px 6px; border-radius: 6px; background: #f8f8f8; color: #666; }
.msgitem.me      { background: #fffde7; }
.msgitem.other   { background: #e8f5e9; }
.msgitem.date    { background: #f0f4ff; }
.msgitem.editing { background: #fffbe6; outline: 1px solid #e6cf00; }
.msgitem .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msgitem .ico { cursor: pointer; border: none; background: none; padding: 0 3px; font-size: 13px; line-height: 1; color: #999; }
.msgitem .ico.del { color: #c00; }
.msgitem .ico.disabled { opacity: .3; pointer-events: none; }
.empty { font-size: 12px; color: #bbb; text-align: center; padding: 14px; }

/* ── 오른쪽 미리보기 ── */
.preview-col { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.preview { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

/* ── 미리보기 헤더 ── */
.preview-header { background: #3a1d96; padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.preview-back { font-size: 18px; color: #fff; }
.preview-more { font-size: 13px; color: rgba(255,255,255,.7); }
.room-name-input { background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,.4); color: #fff; font-size: 14px; font-family: inherit; text-align: center; width: 150px; }
.color-chip-group { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; }
.color-chip { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.color-chip span { font-size: 10px; color: rgba(255,255,255,.7); }
.color-chip-btn { position: relative; width: 28px; height: 28px; border-radius: 8px; border: 2px solid rgba(255,255,255,.5); cursor: pointer; overflow: hidden; transition: transform .1s; }
.color-chip-btn:hover { transform: scale(1.1); border-color: #fff; }
.color-chip-btn input[type=color] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: none; padding: 0; }
.reset-chip { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
.reset-chip span { font-size: 10px; color: rgba(255,255,255,.5); }
.reset-btn-circle { width: 28px; height: 28px; border-radius: 8px; border: 2px solid rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; }

/* ── 채팅 영역 ── */
.chat-area { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.chat-empty { color: #555; margin: auto; }
.date-div { text-align: center; margin: 10px 0; font-size: 11px; color: #444; background: rgba(255,255,255,.5); display: inline-block; padding: 3px 14px; border-radius: 20px; align-self: center; }

/* ── 말풍선 ── */
.bubble-row { display: flex; align-items: flex-start; gap: 6px; margin: 2px 0; }
.bubble-row.me { flex-direction: row-reverse; }
.avatar { width: 36px; height: 36px; border-radius: 12px; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; align-self: flex-start; overflow: hidden; padding: 0; }
.avatar.hidden { visibility: hidden; }
.avatar-img { width: 100%; height: 100%; object-fit: cover; }
.bubble-wrap { display: flex; flex-direction: column; gap: 2px; max-width: 200px; width: auto; }
.bubble-row.me .bubble-wrap { align-items: flex-end; }
.sender-name { font-size: 11px; color: #333; padding-left: 2px; }
.bubble { padding: 8px 12px; font-size: 14px; line-height: 1.5; word-break: break-all; white-space: pre-wrap; display: inline-block; width: fit-content; }
.bubble.me { border-radius: 18px 4px 18px 18px; }
.bubble.ot { border-radius: 4px 18px 18px 18px; }
.msg-img { width: 100%; max-width: 200px; height: 160px; object-fit: cover; border-radius: 12px; margin-top: 4px; display: block; }

/* ── 출력 영역 ── */
.output-area { padding: 12px 14px; border-top: 1px solid #eee; flex-shrink: 0; background: #fff; }
.output-area button { width: 100%; padding: 10px; background: #FEE500; border: 1px solid #e6cf00; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; }

/* ── 이름 & 아바타 행 ── */
.name-row { display: flex; align-items: center; gap: 8px; }
.name-row input { flex: 1; }
.avatar-upload-wrap { position: relative; width: 36px; height: 36px; flex-shrink: 0; }
.avatar-preview { width: 36px; height: 36px; border-radius: 12px; background: #888; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; overflow: hidden; border: 1px solid #ddd; cursor: pointer; }
.img-attach-row { display: flex; align-items: center; gap: 8px; }
.img-attach-label { cursor: pointer; padding: 6px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; color: #555; background: #f9f9f9; white-space: nowrap; margin: 0; }
.img-name { font-size: 12px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

/* ── 모달 ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 620px; max-width: 90vw; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 14px; font-weight: 600; color: #333; }
.modal-close { border: none; background: none; cursor: pointer; font-size: 18px; color: #888; padding: 0; line-height: 1; }
.modal-close:hover { color: #333; }
.output-wrap-header { display: flex; justify-content: flex-end; }
.btn-select-all { font-size: 12px; padding: 4px 10px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; background: #f5f5f5; font-family: inherit; }
.output-box { width: 100%; height: 300px; font-size: 11px; font-family: monospace; border: 1px solid #ddd; border-radius: 8px; padding: 8px; resize: vertical; }

/* ── 애니메이션 ── */
.tab-flash { animation: flash .25s ease; }
@keyframes flash { 0%{opacity:1} 50%{opacity:.3} 100%{opacity:1} }

/* ── 생성 HTML용 ── */
.kt-av.hidden { visibility: hidden; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 왼쪽 패널 -->
  <div class="panel">
    <div class="panel-body">
      <h2>메시지 입력</h2>
      <div class="edit-banner" id="edit-banner">✏️ 수정 중 — 저장하면 해당 항목이 변경돼요</div>

      <div>
        <label>말풍선 방향</label>
        <div class="seg">
          <button class="active" id="btn-me" onclick="setType('me')">나 (오른쪽)</button>
          <button id="btn-other" onclick="setType('other')">상대방 (왼쪽)</button>
        </div>
        <p class="shortcut-hint"><kbd>Tab</kbd> 전환 &nbsp;·&nbsp; <kbd>Enter</kbd> 추가</p>
      </div>

      <div id="name-area">
        <label>상대방 이름 & 프로필</label>
        <div class="name-row">
          <input type="text" id="sender-name" placeholder="예: 친구" value="친구" />
          <div class="avatar-upload-wrap">
            <div id="other-avatar-preview" class="avatar-preview"
                 onclick="document.getElementById('other-avatar-input').click()"
                 title="프로필 사진">📷</div>
            <input type="file" id="other-avatar-input" accept="image/*" style="display:none"
                   onchange="handleOtherAvatar(this)" />
          </div>
          <button onclick="clearOtherAvatar()" id="other-avatar-clear" class="btn-clear">✕</button>
        </div>
      </div>

      <div>
        <label>메시지 내용</label>
        <textarea id="msg-input" placeholder="내용 입력 (이미지만 전송도 가능)"></textarea>
      </div>

      <div>
        <label>이미지 첨부 (선택)</label>
        <div class="img-attach-row">
          <label for="msg-img-input" class="img-attach-label">🖼 파일 선택</label>
          <input type="file" id="msg-img-input" accept="image/*" style="display:none"
                 onchange="handleMsgImg(this)" />
          <span id="msg-img-name" class="img-name">없음</span>
          <button onclick="clearMsgImg()" id="msg-img-clear" class="btn-clear">✕</button>
        </div>
        <img id="msg-img-preview" class="img-preview" src="" alt="" />
      </div>

      <div>
        <label>추가 위치</label>
        <select id="insert-pos"><option value="-1">맨 끝에 추가</option></select>
      </div>

      <button class="btn primary" id="submit-btn" onclick="submitMsg()">+ 메시지 추가</button>
      <button class="btn ghost hidden" id="cancel-btn" onclick="cancelEdit()">취소</button>

      <div>
        <button class="btn ghost" onclick="toggleDateInput()">📅 날짜 구분선 추가</button>
        <div class="date-input-area" id="date-area">
          <input type="date" id="date-input" />
          <button onclick="confirmDate()">확인</button>
        </div>
      </div>

      <div>
        <label>입력된 항목 (<span id="msg-count">0</span>개)</label>
        <div class="msglist" id="msglist">
          <p class="empty">아직 메시지가 없어요</p>
        </div>
      </div>
    </div>

    <div class="panel-footer">
      <button class="btn danger" onclick="clearAll()">전체 초기화</button>
    </div>
  </div>

  <!-- 오른쪽 미리보기 -->
  <div class="preview-col">
    <div class="preview" id="preview" style="background:#b2c7d9">
      <div class="preview-header">
        <span class="preview-back">←</span>
        <input id="room-name" class="room-name-input" value="대화방" />
        <div class="color-chip-group">
          <div class="color-chip">
            <span>배경</span>
            <div class="color-chip-btn" id="bg-chip" style="background:#b2c7d9">
              <input type="color" id="bg-picker" value="#b2c7d9" oninput="onColor('bg', this.value)" />
            </div>
          </div>
          <div class="color-chip">
            <span>나</span>
            <div class="color-chip-btn" id="me-chip" style="background:#FEE500">
              <input type="color" id="me-picker" value="#FEE500" oninput="onColor('me', this.value)" />
            </div>
          </div>
          <div class="color-chip">
            <span>상대</span>
            <div class="color-chip-btn" id="ot-chip" style="background:#ffffff">
              <input type="color" id="ot-picker" value="#ffffff" oninput="onColor('ot', this.value)" />
            </div>
          </div>
          <div class="reset-chip" onclick="resetColors()">
            <span>초기화</span>
            <div class="reset-btn-circle">↩</div>
          </div>
        </div>
        <span class="preview-more">⋯</span>
      </div>

      <div class="chat-area" id="chat-area">
        <p class="empty chat-empty">메시지를 추가하면 여기에 표시됩니다</p>
      </div>
    </div>

    <div class="output-area">
      <button onclick="generateHTML()">HTML 코드 생성</button>
    </div>
  </div>

</div>

<!-- 모달 -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">생성된 HTML 코드</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="output-wrap-header">
      <button onclick="selectAll()" class="btn-select-all">전체 선택</button>
    </div>
    <textarea id="output-box" class="output-box" readonly></textarea>
    <p class="copy-msg" id="copy-msg">✅ 전체 선택됐어요! Ctrl+C로 복사하세요.</p>
  </div>
</div>

<script>
let msgs = [], currentType = 'me', editingId = null;
let currentOtherAvatar = null, currentMsgImg = null;
const colors = { bg: '#b2c7d9', me: '#FEE500', ot: '#ffffff' };
const defaults = { bg: '#b2c7d9', me: '#FEE500', ot: '#ffffff' };
const AC = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#DDA0DD', '#98D8C8', '#F7A35C', '#7CB9E8'];

function avatarColor(name) {
  let h = 0;
  for (let c of name) h = (h * 31 + c.charCodeAt(0)) % AC.length;
  return AC[h];
}

function isDark(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (r*299 + g*587 + b*114) / 1000 < 128;
}

function onColor(key, v) {
  colors[key] = v;
  document.getElementById(`${key}-picker`).value = v;
  document.getElementById(`${key}-chip`).style.background = v;
  if (key === 'bg') document.getElementById('preview').style.background = v;
  renderPreview();
}

function resetColors() { Object.keys(defaults).forEach(k => onColor(k, defaults[k])); }

function setType(t, flash = false) {
  currentType = t;
  document.getElementById('btn-me').classList.toggle('active', t === 'me');
  document.getElementById('btn-other').classList.toggle('active', t === 'other');
  document.getElementById('name-area').classList.toggle('active', t === 'other');
  if (flash) {
    const s = document.querySelector('.seg');
    s.classList.remove('tab-flash'); void s.offsetWidth; s.classList.add('tab-flash');
  }
}

function handleOtherAvatar(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    currentOtherAvatar = e.target.result;
    document.getElementById('other-avatar-preview').innerHTML = `<img src="${currentOtherAvatar}" class="avatar-img" />`;
    document.getElementById('other-avatar-clear').classList.add('active');
  };
  reader.readAsDataURL(file);
}

function clearOtherAvatar() {
  currentOtherAvatar = null;
  document.getElementById('other-avatar-input').value = '';
  document.getElementById('other-avatar-preview').innerHTML = '📷';
  document.getElementById('other-avatar-clear').classList.remove('active');
}

function handleMsgImg(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    currentMsgImg = e.target.result;
    document.getElementById('msg-img-preview').src = currentMsgImg;
    document.getElementById('msg-img-preview').classList.add('active');
    document.getElementById('msg-img-name').textContent = file.name;
    document.getElementById('msg-img-clear').classList.add('active');
  };
  reader.readAsDataURL(file);
}

function clearMsgImg() {
  currentMsgImg = null;
  document.getElementById('msg-img-input').value = '';
  document.getElementById('msg-img-preview').classList.remove('active');
  document.getElementById('msg-img-preview').src = '';
  document.getElementById('msg-img-name').textContent = '없음';
  document.getElementById('msg-img-clear').classList.remove('active');
}

const textarea = document.getElementById('msg-input');
textarea.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    setType(currentType === 'me' ? 'other' : 'me', true);
    if (currentType === 'other' && !document.getElementById('sender-name').value.trim())
      document.getElementById('sender-name').focus();
  } else if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault(); submitMsg();
  }
});

function submitMsg() {
  const content = textarea.value.trim();
  if (!content && !currentMsgImg) return;
  const name = currentType === 'other' ? (document.getElementById('sender-name').value.trim() || '상대방') : '나';
  const avatar = currentType === 'other' ? currentOtherAvatar : null;
  if (editingId !== null) {
    const idx = msgs.findIndex(m => m.id === editingId);
    if (idx > -1) msgs[idx] = { ...msgs[idx], type: currentType, name, content, avatar, img: currentMsgImg };
    cancelEdit();
  } else {
    const pos = parseInt(document.getElementById('insert-pos').value);
    const newMsg = { type: currentType, name, content, avatar, img: currentMsgImg, id: Date.now() };
    if (pos === -1) msgs.push(newMsg); else msgs.splice(pos + 1, 0, newMsg);
    textarea.value = ''; clearMsgImg();
  }
  renderList(); renderPreview(); textarea.focus();
}

function toggleDateInput() {
  const el = document.getElementById('date-area');
  el.classList.toggle('open');
  if (el.classList.contains('open')) document.getElementById('date-input').focus();
}

function confirmDate() {
  const val = document.getElementById('date-input').value; if (!val) return;
  const d = new Date(val);
  const days = ['일','월','화','수','목','금','토'];
  const label = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
  const pos = parseInt(document.getElementById('insert-pos').value);
  const newMsg = { type: 'date', content: label, id: Date.now() };
  if (pos === -1) msgs.push(newMsg); else msgs.splice(pos + 1, 0, newMsg);
  document.getElementById('date-area').classList.remove('open');
  document.getElementById('date-input').value = '';
  renderList(); renderPreview();
}

function editMsg(id) {
  const m = msgs.find(x => x.id === id);
  if (!m || m.type === 'date') return;
  editingId = id; setType(m.type);
  textarea.value = m.content;
  if (m.type === 'other') {
    document.getElementById('sender-name').value = m.name;
    currentOtherAvatar = m.avatar || null;
    const p = document.getElementById('other-avatar-preview');
    if (m.avatar) {
      p.innerHTML = `<img src="${m.avatar}" class="avatar-img" />`;
      document.getElementById('other-avatar-clear').classList.add('active');
    } else { clearOtherAvatar(); }
  }
  if (m.img) {
    currentMsgImg = m.img;
    document.getElementById('msg-img-preview').src = m.img;
    document.getElementById('msg-img-preview').classList.add('active');
    document.getElementById('msg-img-name').textContent = '이미지 있음';
    document.getElementById('msg-img-clear').classList.add('active');
  } else { clearMsgImg(); }
  document.getElementById('submit-btn').textContent = '💾 저장';
  document.getElementById('submit-btn').className = 'btn save';
  document.getElementById('cancel-btn').classList.remove('hidden');
  document.getElementById('edit-banner').classList.add('active');
  textarea.focus(); renderList();
}

function cancelEdit() {
  editingId = null; textarea.value = '';
  document.getElementById('submit-btn').textContent = '+ 메시지 추가';
  document.getElementById('submit-btn').className = 'btn primary';
  document.getElementById('cancel-btn').classList.add('hidden');
  document.getElementById('edit-banner').classList.remove('active');
  renderList();
}

function moveMsg(id, dir) {
  const idx = msgs.findIndex(m => m.id === id);
  const to = idx + dir;
  if (to < 0 || to >= msgs.length) return;
  [msgs[idx], msgs[to]] = [msgs[to], msgs[idx]];
  renderList(); renderPreview();
}

function delMsg(id) {
  if (editingId === id) cancelEdit();
  msgs = msgs.filter(m => m.id !== id);
  renderList(); renderPreview();
}

function clearAll() {
  msgs = []; cancelEdit();
  document.getElementById('msg-input').value = '';
  document.getElementById('sender-name').value = '친구';
  setType('me');
  document.getElementById('date-area').classList.remove('open');
  document.getElementById('date-input').value = '';
  document.getElementById('insert-pos').innerHTML = '<option value="-1">맨 끝에 추가</option>';
  clearMsgImg(); clearOtherAvatar();
  renderList(); renderPreview();
}

function updatePosSelect() {
  const sel = document.getElementById('insert-pos');
  const prev = sel.value;
  sel.innerHTML = '<option value="-1">맨 끝에 추가</option>';
  msgs.forEach((m, i) => {
    const label = m.type === 'date' ? '📅 ' + m.content
      : (m.type === 'me' ? '나' : '👤 ' + m.name) + ': ' + m.content.slice(0,14) + (m.content.length > 14 ? '…' : '');
    sel.innerHTML += `<option value="${i}">${i+1}번 뒤에 추가 — ${label}</option>`;
  });
  sel.value = prev && [...sel.options].some(o => o.value === prev) ? prev : '-1';
}

function renderList() {
  const el = document.getElementById('msglist');
  document.getElementById('msg-count').textContent = msgs.length;
  updatePosSelect();
  if (!msgs.length) { el.innerHTML = '<p class="empty">아직 메시지가 없어요</p>'; return; }
  el.innerHTML = msgs.map((m, i) => `
    <div class="msgitem ${m.type}${editingId === m.id ? ' editing' : ''}">
      <button class="ico${i === 0 ? ' disabled' : ''}" onclick="moveMsg(${m.id},-1)">↑</button>
      <button class="ico${i === msgs.length-1 ? ' disabled' : ''}" onclick="moveMsg(${m.id},1)">↓</button>
      <span class="lbl">${m.type === 'date' ? '📅 '+m.content : (m.type==='me'?'나':'👤 '+m.name)+': '+m.content}</span>
      ${m.type !== 'date' ? `<button class="ico" onclick="editMsg(${m.id})">✏️</button>` : ''}
      <button class="ico del" onclick="delMsg(${m.id})">✕</button>
    </div>`).join('');
}

function renderPreview() {
  const area = document.getElementById('chat-area');
  if (!msgs.length) { area.innerHTML = '<p class="empty chat-empty">메시지를 추가하면 여기에 표시됩니다</p>'; return; }
  let html = '', prevName = '';
  const meText = isDark(colors.me) ? '#fff' : '#111';
  const otText = isDark(colors.ot) ? '#fff' : '#111';
  msgs.forEach(m => {
    if (m.type === 'date') { html += `<div class="date-div">${m.content}</div>`; prevName = ''; return; }
    const isMe = m.type === 'me';
    const showName = !isMe && m.name !== prevName;
    if (!isMe) prevName = m.name; else prevName = '';
    const bg = isMe ? colors.me : colors.ot;
    const tc = isMe ? meText : otText;
    const avatarHtml = m.avatar ? `<img src="${m.avatar}" class="avatar-img" />` : m.name[0];
    html += `
      <div class="bubble-row ${isMe ? 'me' : ''}">
        ${!isMe ? `<div class="avatar${!showName ? ' hidden' : ''}" style="background:${avatarColor(m.name)}">${avatarHtml}</div>` : ''}
        <div class="bubble-wrap">
          ${showName ? `<span class="sender-name">${m.name}</span>` : ''}
          <div class="bubble ${isMe ? 'me' : 'ot'}" style="background:${bg};color:${tc}">${m.content.replace(/\n/g,'<br>')}</div>
          ${m.img ? `<img src="${m.img}" class="msg-img" />` : ''}
        </div>
      </div>`;
  });
  area.innerHTML = html;
  area.scrollTop = area.scrollHeight;
}

function generateHTML() {
  const roomName = document.getElementById('room-name').value;
  const meText = isDark(colors.me) ? '#fff' : '#111';
  const otText = isDark(colors.ot) ? '#fff' : '#111';
  const css = `.kt { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: ${colors.bg}; border-radius: 12px; overflow: hidden; max-width: 380px; margin: 0 auto; }
.kt-hd { background: #3a1d96; color: #fff; padding: 12px 16px; font-size: 15px; font-weight: bold; }
.kt-c { padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; }
.kt-d { text-align: center; margin: 10px 0; font-size: 11px; color: #444; background: rgba(255,255,255,.5); display: inline-block; padding: 3px 14px; border-radius: 20px; align-self: center; }
.kt-r { display: flex; align-items: flex-start; gap: 6px; margin: 2px 0; }
.kt-r.me { flex-direction: row-reverse; }
.kt-av { width: 36px; height: 36px; border-radius: 12px; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; flex-shrink: 0; align-self: flex-start; overflow: hidden; padding: 0; }
.kt-av img { width: 100%; height: 100%; object-fit: cover; }
.kt-av.hidden { visibility: hidden; }
.kt-w { display: flex; flex-direction: column; gap: 2px; max-width: 200px; width: auto; }
.kt-r.me .kt-w { align-items: flex-end; }
.kt-sn { font-size: 11px; color: #333; padding-left: 2px; }
.kt-b { padding: 8px 12px; font-size: 14px; line-height: 1.5; word-break: break-all; white-space: pre-wrap; display: inline-block; width: fit-content; }
.kt-b.me { background: ${colors.me}; border-radius: 18px 4px 18px 18px; color: ${meText}; }
.kt-b.ot { background: ${colors.ot}; border-radius: 4px 18px 18px 18px; color: ${otText}; }
.kt-mi { width: 100%; max-width: 200px; height: 160px; object-fit: cover; border-radius: 12px; margin-top: 4px; display: block; }`;
  let body = '', prevName = '';
  msgs.forEach(m => {
    if (m.type === 'date') { body += `<div class="kt-d">${m.content}</div>\n`; prevName = ''; return; }
    const isMe = m.type === 'me';
    const showName = !isMe && m.name !== prevName;
    if (!isMe) prevName = m.name; else prevName = '';
    const avatarHtml = m.avatar ? `<img src="${m.avatar}" />` : m.name[0];
    body += `
<div class="kt-r ${isMe ? 'me' : ''}">
  ${!isMe ? `<div class="kt-av${!showName ? ' hidden' : ''}" style="background:${avatarColor(m.name)}">${avatarHtml}</div>` : ''}
  <div class="kt-w">
    ${showName ? `<span class="kt-sn">${m.name}</span>` : ''}
    <div class="kt-b ${isMe ? 'me' : 'ot'}">${m.content.replace(/\n/g,'<br>')}</div>
    ${m.img ? `<img src="${m.img}" class="kt-mi" />` : ''}
  </div>
</div>`;
  });
  const full = `<!-- 카카오톡 대화 백업 -->\n<style>\n${css}\n</style>\n<div class="kt">\n  <div class="kt-hd">${roomName}</div>\n  <div class="kt-c">${body}\n  </div>\n</div>`;
  const box = document.getElementById('output-box');
  box.value = full;
  document.getElementById('modal-overlay').classList.add('open');
  box.select();
  document.execCommand('copy');
  const msg = document.getElementById('copy-msg');
  msg.classList.add('active');
  setTimeout(() => msg.classList.remove('active'), 4000);
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function handleOverlayClick(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }
function selectAll() {
  const box = document.getElementById('output-box');
  box.select(); document.execCommand('copy');
  const msg = document.getElementById('copy-msg');
  msg.classList.add('active');
  setTimeout(() => msg.classList.remove('active'), 4000);
}

textarea.focus();
</script>
</body>
</html>
